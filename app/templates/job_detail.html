{% extends "base.html" %}

{% block title %}Job details — SmartJobs{% endblock %}

{% block content %}
<div style="margin-bottom: 20px;">
    <a href="/dashboard" class="button secondary" style="padding: 8px 14px; font-size: 13px; font-weight: 600; text-decoration: none;">
        ← Back to Opportunities
    </a>
</div>

<div id="jobContainer" class="job-detail-card">
    <div style="padding: 40px; text-align: center; color: var(--text-secondary);">
        Loading job specifications...
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const jobId = {{ job_id }};

async function loadJob() {
    const response = await fetch(`/api/jobs/${jobId}`);
    const data = await response.json();

    if (!response.ok) {
        document.getElementById("jobContainer").innerHTML = "<h2 style='color: var(--text-primary);'>Job record not found</h2>";
        return;
    }

    const job = data.job;
    const recommendation = data.recommendation;
    const skillGap = data.skill_gap || {};
    const interviewPrep = data.interview_prep || [];

    await recordAction("viewed");

    const matchingSkills = skillGap.matching_skills || [];
    const missingSkills = skillGap.missing_skills || [];
    const matchPct = skillGap.match_percentage || 0;
    const companyInitial = (job.company || 'C').charAt(0).toUpperCase();
    const formattedComp = job.compensation > 0 
        ? `₹${Number(job.compensation).toLocaleString('en-IN')} / ${job.compensation_period || 'month'}`
        : 'Disclosed in Interview';

    const sourceName = escapeHtml(job.source || 'Direct');
    const sourceClass = (job.source || 'manual').toLowerCase();

    document.getElementById("jobContainer").innerHTML = `
        <!-- Header Hero Strip -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 20px;">
            <div style="display: flex; gap: 16px; align-items: center;">
                <div class="company-logo-avatar">
                    ${companyInitial}
                </div>
                <div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <h2 style="font-size: 16px; font-weight: 700; color: var(--text-secondary); margin: 0;">${escapeHtml(job.company)}</h2>
                        <span style="color: var(--primary-blue); font-size: 13px; font-weight: 700;">✓ Verified</span>
                    </div>
                    <h1 style="font-size: 26px; font-weight: 800; color: var(--text-primary); margin: 4px 0 0 0; line-height: 1.2;">${escapeHtml(job.title)}</h1>
                </div>
            </div>

            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                ${recommendation ? `
                    <span style="background: linear-gradient(135deg, rgba(37, 99, 235, 0.15), rgba(16, 185, 129, 0.15)); color: var(--primary-blue); border: 1px solid rgba(37, 99, 235, 0.25); padding: 8px 14px; border-radius: 99px; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px;">
                        ⚡ ${Math.round(recommendation.score * 100)}% Profile Match
                    </span>
                ` : ''}
                <span class="platform-badge ${sourceClass}">${sourceName}</span>
                <span class="tag" style="background: var(--bg-main); border: 1px solid var(--card-border); color: var(--text-secondary); text-transform: capitalize;">${escapeHtml(job.role_type || 'internship')}</span>
            </div>
        </div>

        <!-- Metadata Cards Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 24px 0;">
            <div class="meta-pill-card">
                <span style="font-size: 20px;">📍</span>
                <div>
                    <div style="font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">LOCATION</div>
                    <div style="font-size: 14px; font-weight: 700; color: var(--text-primary);">${escapeHtml(job.location || 'Remote')}</div>
                </div>
            </div>

            <div class="meta-pill-card">
                <span style="font-size: 20px;">💼</span>
                <div>
                    <div style="font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">WORK MODE</div>
                    <div style="font-size: 14px; font-weight: 700; color: var(--text-primary); text-transform: capitalize;">${escapeHtml(job.work_mode)}</div>
                </div>
            </div>

            <div class="meta-pill-card">
                <span style="font-size: 20px;">💰</span>
                <div>
                    <div style="font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">COMPENSATION</div>
                    <div style="font-size: 14px; font-weight: 700; color: var(--primary-blue);">${formattedComp}</div>
                </div>
            </div>
        </div>

        <!-- AI Skill Gap Inspector Widget -->
        <div style="background: var(--bg-main); border: 1px solid var(--card-border); border-radius: 14px; padding: 22px; margin: 24px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 15px; font-weight: 700; color: var(--text-primary); margin: 0;">🤖 AI Skill Match Inspector</h3>
                <span style="font-size: 13px; font-weight: 800; color: var(--primary-blue);">${matchPct}% Required Skills Cover</span>
            </div>

            <div style="background: var(--card-border); height: 8px; border-radius: 999px; overflow: hidden; margin-bottom: 18px;">
                <div style="background: linear-gradient(90deg, #3b82f6 0%, #10b981 100%); height: 100%; width: ${matchPct}%; border-radius: 999px; transition: width 0.6s ease;"></div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px;">
                <div>
                    <div style="font-size: 12px; font-weight: 700; color: #10b981; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">✓ Matching Skills You Possess</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                        ${matchingSkills.length ? matchingSkills.map(s => `<span class="skill-tag-matched">✓ ${escapeHtml(s)}</span>`).join('') : '<span style="font-size: 13px; color: var(--text-secondary);">None listed in your profile</span>'}
                    </div>
                </div>

                <div>
                    <div style="font-size: 12px; font-weight: 700; color: #f59e0b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">⚡ Skills to Learn to Maximize Score</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                        ${missingSkills.length ? missingSkills.map(s => `<span class="skill-tag-missing">+ ${escapeHtml(s)}</span>`).join('') : '<span style="font-size: 13px; font-weight: 600; color: #10b981;">🎉 You match 100% of required skills!</span>'}
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Match Rationale Card -->
        ${recommendation ? `
            <div class="reasoning-box">
                <h4 style="font-size: 14px; font-weight: 700; color: var(--text-primary); margin: 0 0 8px 0; display: flex; align-items: center; gap: 6px;">
                    ✨ Why This Opportunity is Ranked for You
                </h4>
                <p style="font-size: 13.5px; color: var(--text-primary); line-height: 1.6; margin: 0;">
                    ${escapeHtml(recommendation.explanation)}
                </p>
            </div>
        ` : ''}

        <!-- Job Description Section -->
        <div style="margin: 28px 0;">
            <h3 style="font-size: 17px; font-weight: 800; color: var(--text-primary); margin-bottom: 12px;">Job Overview & Description</h3>
            <div style="font-size: 14.5px; color: var(--text-primary); line-height: 1.7; white-space: pre-line;">${escapeHtml(job.description)}</div>
        </div>

        <!-- Targeted Interview Preparation Questions -->
        ${interviewPrep.length ? `
            <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 28px 0;">
            <div style="margin: 28px 0;">
                <h3 style="font-size: 17px; font-weight: 800; color: var(--text-primary); margin-bottom: 16px;">💬 Targeted Interview Preparation Questions</h3>
                <div style="display: flex; flex-direction: column; gap: 14px;">
                    ${interviewPrep.map((q, idx) => `
                        <div class="interview-card">
                            <strong style="font-size: 14px; font-weight: 700; color: var(--text-primary); display: block; margin-bottom: 6px; line-height: 1.4;">Q${idx + 1}: ${escapeHtml(q.question)}</strong>
                            <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0;">💡 <em>Tip: ${escapeHtml(q.tip)}</em></p>
                        </div>
                    `).join('')}
                </div>
            </div>
        ` : ''}

        <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 28px 0;">

        <!-- Action Bar -->
        <div class="job-actions">
            <a class="button primary"
               href="${escapeHtml(job.apply_url)}"
               target="_blank"
               rel="noopener"
               onclick="recordAction('clicked_apply')">
               Apply Direct 🚀
            </a>

            <button type="button" class="button ai-btn"
                    onclick="generateOutreachEmail()">
                ✉️ AI Outreach Email
            </button>

            <button type="button" class="button secondary"
                    onclick="recordAction('saved')">
                📌 Save / Bookmark
            </button>

            <button type="button" class="button secondary"
                    onclick="downloadCalendarEvent('${escapeHtml(job.title)}', '${escapeHtml(job.company)}')">
                📅 Add to Calendar (.ics)
            </button>
        </div>

        <div id="outreachContainer" style="display: none; margin-top: 24px; padding: 24px; background: var(--bg-main); border: 1px solid var(--card-border); border-radius: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h3 style="font-size: 17px; font-weight: 800; color: var(--primary-blue); margin: 0;">✉️ AI Cold Email & Cover Letter</h3>
                <button type="button" class="button secondary" style="padding: 4px 10px; font-size: 12px;" onclick="document.getElementById('outreachContainer').style.display='none'">Close ✕</button>
            </div>

            <label style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">SUBJECT LINE:</label>
            <input id="outreachSubject" readonly style="font-weight: 600; margin-bottom: 14px; margin-top: 4px;">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                <label style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">RECRUITER COLD EMAIL:</label>
                <button type="button" class="button secondary" style="padding: 4px 10px; font-size: 12px;" onclick="copyText('outreachBody', 'Cold email copied!')">📋 Copy Email</button>
            </div>
            <textarea id="outreachBody" rows="8" readonly style="font-family: inherit; font-size: 13.5px; line-height: 1.6; margin-top: 4px;"></textarea>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
                <label style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-secondary);">TAILORED COVER LETTER:</label>
                <button type="button" class="button secondary" style="padding: 4px 10px; font-size: 12px;" onclick="copyText('outreachCover', 'Cover letter copied!')">📋 Copy Cover Letter</button>
            </div>
            <textarea id="outreachCover" rows="10" readonly style="font-family: inherit; font-size: 13.5px; line-height: 1.6; margin-top: 4px;"></textarea>
        </div>

        <p id="actionMessage" style="margin-top: 14px; font-size: 14px; font-weight: 700; color: #10b981;"></p>
    `;
}

async function recordAction(action) {
    const response = await fetch(`/api/jobs/${jobId}/action`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action})
    });

    const data = await response.json();
    const message = document.getElementById("actionMessage");
    if (message) {
        message.textContent = response.ok ? "✓ Action saved to your tracker!" : (data.detail || "Could not record action.");
        setTimeout(() => { message.textContent = ""; }, 4000);
    }
}

function downloadCalendarEvent(title, company) {
    const icsData = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//SmartJobs//Career Reminder//EN
BEGIN:VEVENT
SUMMARY:Application & Interview Deadline: ${title} at ${company}
DESCRIPTION:Follow up on your job application for ${title} at ${company} on SmartJobs.
LOCATION:Online / Direct Posting
STATUS:CONFIRMED
END:VEVENT
END:VCALENDAR`;

    const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
    const link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.setAttribute('download', `${title.replace(/[^a-z0-9]/gi, '_')}_reminder.ics`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

async function generateOutreachEmail() {
    const container = document.getElementById("outreachContainer");
    container.style.display = "block";
    document.getElementById("outreachSubject").value = "Generating email...";
    document.getElementById("outreachBody").value = "Generating email...";
    document.getElementById("outreachCover").value = "Generating cover letter...";

    try {
        const response = await fetch(`/api/jobs/${jobId}/generate-outreach`, { method: "POST" });
        if (!response.ok) return;
        const data = await response.json();

        document.getElementById("outreachSubject").value = data.subject || "";
        document.getElementById("outreachBody").value = data.cold_email || "";
        document.getElementById("outreachCover").value = data.cover_letter || "";
        if (typeof showToast === 'function') showToast("✉️ AI Cold Email & Cover Letter generated!");
    } catch (err) {
        console.error("Outreach generation error:", err);
    }
}

function copyText(elementId, successMsg) {
    const elem = document.getElementById(elementId);
    if (!elem) return;
    navigator.clipboard.writeText(elem.value);
    if (typeof showToast === 'function') showToast(`📋 ${successMsg}`);
}

function escapeHtml(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

loadJob();
</script>
{% endblock %}
