{% extends "base.html" %}

{% block title %}Job details — SmartJobs{% endblock %}

{% block content %}
<div id="jobContainer" class="card">
    Loading job details...
</div>
{% endblock %}

{% block scripts %}
<script>
const jobId = {{ job_id }};

async function loadJob() {
    const response = await fetch(`/api/jobs/${jobId}`);
    const data = await response.json();

    if (!response.ok) {
        document.getElementById("jobContainer").innerHTML = "<h2>Job not found</h2>";
        return;
    }

    const job = data.job;
    const recommendation = data.recommendation;
    const skillGap = data.skill_gap || {};
    const interviewPrep = data.interview_prep || [];

    await recordAction("viewed");

    const matchingSkills = skillGap.matching_skills || [];
    const missingSkills = skillGap.missing_skills || [];
    const matchPct = skillGap.match_percentage || 0;

    document.getElementById("jobContainer").innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <span class="score">
                ${recommendation ? Math.round(recommendation.score * 100) + "% match" : "Not ranked"}
            </span>

            <div style="display: flex; gap: 8px; align-items: center;">
                <span class="platform-badge ${(job.source || 'manual').toLowerCase()}">${escapeHtml(job.source || 'Direct')}</span>
                <span class="tag">${escapeHtml(job.role_type || 'internship')}</span>
            </div>
        </div>

        <h1 style="font-size: 26px; font-weight: 800; margin-top: 12px;">${escapeHtml(job.title)}</h1>
        <h2 class="company" style="font-size: 18px; margin-bottom: 12px;">${escapeHtml(job.company)}</h2>

        <p style="color: #475569; font-size: 14px; margin-bottom: 8px;">
            📍 ${escapeHtml(job.location || 'Remote')} · ${escapeHtml(job.work_mode)} · Compensation: ${job.compensation > 0 ? '₹' + job.compensation + ' / ' + job.compensation_period : 'Disclosed during interview'}
        </p>

        <!-- AI Skill Gap Inspector Widget -->
        <div style="background: linear-gradient(135deg, #f8fafc, #f1f5f9); border: 1px solid #cbd5e1; border-radius: 12px; padding: 18px; margin: 20px 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 15px; font-weight: 700; color: #1e293b;">🤖 AI Skill Match Inspector</h3>
                <span style="font-size: 13px; font-weight: 700; color: #2563eb;">${matchPct}% Skill Match</span>
            </div>

            <div style="background: #e2e8f0; height: 8px; border-radius: 999px; overflow: hidden; margin-bottom: 14px;">
                <div style="background: linear-gradient(90deg, #3b82f6, #10b981); height: 100%; width: ${matchPct}%;"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div>
                    <strong style="font-size: 12px; text-transform: uppercase; color: #15803d; letter-spacing: 0.5px;">✔ Matching Skills You Have</strong>
                    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;">
                        ${matchingSkills.length ? matchingSkills.map(s => `<span class="tag" style="background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0;">${escapeHtml(s)}</span>`).join('') : '<span style="font-size: 13px; color: #94a3b8;">None listed in your profile</span>'}
                    </div>
                </div>

                <div>
                    <strong style="font-size: 12px; text-transform: uppercase; color: #d97706; letter-spacing: 0.5px;">⚡ Skills to Learn to Boost Score</strong>
                    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;">
                        ${missingSkills.length ? missingSkills.map(s => `<span class="tag" style="background: #fef3c7; color: #b45309; border: 1px solid #fde68a;">+ ${escapeHtml(s)}</span>`).join('') : '<span style="font-size: 13px; color: #15803d;">You match all required skills!</span>'}
                    </div>
                </div>
            </div>
        </div>

        ${
            recommendation
            ? `<div class="explanation" style="margin-bottom: 20px;">
                 <strong>Why this is recommended:</strong>
                 ${escapeHtml(recommendation.explanation)}
               </div>`
            : ""
        }

        <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 8px;">Job Description</h3>
        <p class="job-description" style="margin-top: 0;">${escapeHtml(job.description)}</p>

        <!-- Interview Preparation Helper -->
        ${interviewPrep.length ? `
            <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 24px 0;">
            <div style="margin: 24px 0;">
                <h3 style="font-size: 17px; font-weight: 800; color: var(--text-primary); margin-bottom: 14px;">💬 Targeted Interview Preparation Questions</h3>
                <div style="display: flex; flex-direction: column; gap: 14px;">
                    ${interviewPrep.map((q, idx) => `
                        <div style="background: var(--bg-main); border: 1px solid var(--card-border); border-left: 4px solid var(--primary-blue); padding: 16px; border-radius: 12px;">
                            <strong style="font-size: 14px; font-weight: 700; color: var(--text-primary); display: block; margin-bottom: 6px; line-height: 1.4;">Q${idx + 1}: ${escapeHtml(q.question)}</strong>
                            <p style="font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 0;">💡 <em>Tip: ${escapeHtml(q.tip)}</em></p>
                        </div>
                    `).join('')}
                </div>
            </div>
        ` : ''}

        <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 24px 0;">

        <div class="job-actions">
            <a class="button primary"
               href="${escapeHtml(job.apply_url)}"
               target="_blank"
               rel="noopener"
               onclick="recordAction('clicked_apply')">
               Apply Direct 🚀
            </a>

            <button type="button" class="button ai-btn"
                    onclick="generateOutreachEmail()">
                ✉️ AI Outreach Email
            </button>

            <button type="button" class="button secondary"
                    onclick="recordAction('saved')">
                📌 Save / Bookmark
            </button>

            <button type="button" class="button secondary"
                    onclick="downloadCalendarEvent('${escapeHtml(job.title)}', '${escapeHtml(job.company)}')">
                📅 Add to Calendar (.ics)
            </button>
        </div>

        <div id="outreachContainer" style="display: none; margin-top: 20px; padding: 20px; background: var(--bg-color); border: 1px solid var(--card-border); border-radius: 12px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 17px; font-weight: 800; color: #2563eb;">✉️ Generated Cold Email & Cover Letter</h3>
                <button class="button secondary" style="padding: 4px 10px; font-size: 12px;" onclick="document.getElementById('outreachContainer').style.display='none'">Close ✕</button>
            </div>

            <label style="font-size: 12px; text-transform: uppercase; color: #64748b;">Subject Line:</label>
            <input id="outreachSubject" readonly style="font-weight: 600; margin-bottom: 12px;">

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <label style="font-size: 12px; text-transform: uppercase; color: #64748b;">Recruiter Cold Email:</label>
                <button class="button secondary" style="padding: 4px 10px; font-size: 12px;" onclick="copyText('outreachBody', 'Cold email copied!')">📋 Copy Email</button>
            </div>
            <textarea id="outreachBody" rows="8" readonly style="font-family: inherit; font-size: 13px; line-height: 1.6;"></textarea>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <label style="font-size: 12px; text-transform: uppercase; color: #64748b;">Tailored Cover Letter:</label>
                <button class="button secondary" style="padding: 4px 10px; font-size: 12px;" onclick="copyText('outreachCover', 'Cover letter copied!')">📋 Copy Cover Letter</button>
            </div>
            <textarea id="outreachCover" rows="10" readonly style="font-family: inherit; font-size: 13px; line-height: 1.6;"></textarea>
        </div>

        <p id="actionMessage" style="margin-top: 12px; font-size: 14px; font-weight: 600; color: #059669;"></p>
    `;
}

async function recordAction(action) {
    const response = await fetch(`/api/jobs/${jobId}/action`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({action})
    });

    const data = await response.json();
    const message = document.getElementById("actionMessage");
    if (message) {
        message.textContent = response.ok ? "✓ Action saved to your tracker!" : (data.detail || "Could not record action.");
        setTimeout(() => { message.textContent = ""; }, 4000);
    }
}

function downloadCalendarEvent(title, company) {
    const icsData = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//SmartJobs//Career Reminder//EN
BEGIN:VEVENT
SUMMARY:Application & Interview Deadline: ${title} at ${company}
DESCRIPTION:Follow up on your job application for ${title} at ${company} on SmartJobs.
LOCATION:Online / Direct Posting
STATUS:CONFIRMED
END:VEVENT
END:VCALENDAR`;

    const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
    const link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.setAttribute('download', `${title.replace(/[^a-z0-9]/gi, '_')}_reminder.ics`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

async function generateOutreachEmail() {
    const container = document.getElementById("outreachContainer");
    container.style.display = "block";
    document.getElementById("outreachSubject").value = "Generating email...";
    document.getElementById("outreachBody").value = "Generating email...";
    document.getElementById("outreachCover").value = "Generating cover letter...";

    try {
        const response = await fetch(`/api/jobs/${jobId}/generate-outreach`, { method: "POST" });
        if (!response.ok) return;
        const data = await response.json();

        document.getElementById("outreachSubject").value = data.subject || "";
        document.getElementById("outreachBody").value = data.cold_email || "";
        document.getElementById("outreachCover").value = data.cover_letter || "";
        if (typeof showToast === 'function') showToast("✉️ AI Cold Email & Cover Letter generated!");
    } catch (err) {
        console.error("Outreach generation error:", err);
    }
}

function copyText(elementId, successMsg) {
    const elem = document.getElementById(elementId);
    if (!elem) return;
    navigator.clipboard.writeText(elem.value);
    if (typeof showToast === 'function') showToast(`📋 ${successMsg}`);
}

function escapeHtml(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

loadJob();
</script>
{% endblock %}
