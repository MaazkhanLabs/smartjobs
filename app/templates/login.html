{% extends "base.html" %}

{% block title %}Login — SmartJobs{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Welcome back</h1>
    <p>Find internships and jobs matched to your profile.</p>

    <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button id="submitBtn" class="primary" type="submit">Login</button>
    </form>

    <p id="message" style="margin-top: 12px; font-weight: 500; color: #dc2626;"></p>

    <p style="margin-top: 16px;">
        New student?
        <a href="/signup">Create an account</a>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const submitBtn = document.getElementById("submitBtn");
    const messageEl = document.getElementById("message");

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";
    messageEl.textContent = "";

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = "/dashboard";
        } else {
            let errorMsg = "Login failed";
            if (typeof data.detail === "string") {
                errorMsg = data.detail;
            } else if (Array.isArray(data.detail)) {
                errorMsg = data.detail.map(err => err.msg || err).join(", ");
            }
            messageEl.textContent = errorMsg;
        }
    } catch (err) {
        messageEl.textContent = "Network error. Please check server connection.";
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Login";
    }
});
</script>
{% endblock %}
