services:
  - type: web
    name: smartjobs
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m scripts.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Smart Internship Aggregator
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./jobs.db
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: ENABLE_TELEGRAM_BOT
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.9
